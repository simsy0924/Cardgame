name: Phase 3 chain options patch

on:
  push:
    branches:
      - codex/phase3-unify-chain-options
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/phase3-unify-chain-options'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase3-unify-chain-options
          fetch-depth: 0

      - name: Unify chain option collection
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/effects-chain.js')
          text = path.read_text(encoding='utf-8')

          obsolete_helper = '''function collectHbEngineChainOptions(aiCtx) {
            const options = [];
            if (!activeChainState || !activeChainState.active || activeChainState.hbEngine !== true) return options;

            // HB_CHAIN_ENGINE 체인은 레거시 addChainLink와 섞이면 내부 chainState와
            // 화면 mirror/Firebase chainState가 서로 다른 링크 목록을 갖게 된다.
            // 따라서 신엔진 체인에서는 신엔진 QUICK/TRIGGER 응답만 수집한다.
            // AI 응답은 ai.js의 _collectAIEngineActions('chain')가 opponent 컨트롤러로 별도 수집한다.
            if (aiCtx) return options;

            _collectNewEngineChainOptionsForZone(options, G.myHand, 'hand', null);
            _collectNewEngineChainOptionsForZone(options, G.myField, 'field', null);
            _collectNewEngineChainOptionsForZone(options, G.myGrave, 'grave', null);
            _collectNewEngineChainOptionsForZone(options, G.myExile, 'exile', null);
            _collectNewEngineFieldZoneChainOptions(options);
            return options;
          }

          '''

          early_return = '''  if (activeChainState.hbEngine === true) {
            return collectHbEngineChainOptions(aiCtx);
          }

          '''

          if obsolete_helper not in text:
            raise SystemExit('expected collectHbEngineChainOptions block was not found')
          if early_return not in text:
            raise SystemExit('expected HB engine early-return block was not found')

          text = text.replace(obsolete_helper, '', 1)
          text = text.replace(
            early_return,
            '''  // Phase 3: 모든 활성 체인은 동일한 응답 수집 경로를 사용한다.\n  // 레거시 응답의 실제 링크 등록도 addChainLink → HB_CHAIN_ENGINE 어댑터를 타므로\n  // 신엔진 링크 목록과 화면/Firebase 미러가 갈라지지 않는다.\n\n''',
            1,
          )
          path.write_text(text, encoding='utf-8')

      - name: Run engine regression suite
        run: node tests/engine/run-engine-tests.js

      - name: Commit verified implementation
        run: |
          rm .github/workflows/phase3-chain-options-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/effects-chain.js tests/engine/full-chain-migration.test.js .github/workflows/phase3-chain-options-patch.yml
          git commit -m "fix: unify chain response option collection"
          git push origin HEAD:codex/phase3-unify-chain-options
